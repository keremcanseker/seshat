name: Publish VSCode Extension

on:
  push:
    tags:
      - "vscode-v*"
  workflow_dispatch: {}

jobs:
  publish:
    name: Package and publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/vscode

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.1.38"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/vscode-v')
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#vscode-v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "Tag version:     ${TAG_VERSION}"
          echo "package.json:    ${PKG_VERSION}"
          if [ "${TAG_VERSION}" != "${PKG_VERSION}" ]; then
            echo "::error::Version mismatch: tag is 'vscode-v${TAG_VERSION}' but package.json version is '${PKG_VERSION}'."
            exit 1
          fi

      - name: Compile TypeScript
        run: bun run compile

      - name: Publish to VS Code Marketplace
        run: bunx @vscode/vsce@3.2.1 publish --no-git-tag-version --pat "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX Registry
        run: bunx ovsx@0.10.1 publish --pat "$OVSX_PAT"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
