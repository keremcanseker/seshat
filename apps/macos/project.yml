name: Seshat
options:
  bundleIdPrefix: com.keremcan
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_STRICT_CONCURRENCY: complete
    DEAD_CODE_STRIPPING: YES
    GCC_OPTIMIZATION_LEVEL: "0"
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      ONLY_ACTIVE_ARCH: YES
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"

packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: 2.4.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.4

targets:
  Seshat:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Seshat
        excludes:
          - "Info.plist"
          - "Seshat.entitlements"
      - path: ../../cli/seshat
        buildPhase: resources
    info:
      path: Seshat/Info.plist
      properties:
        CFBundleDisplayName: Seshat
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        SUFeedURL: https://dl.seshat.page/appcast.xml
        SUPublicEDKey: d20D7B1PXpBbMWMW6j+iIg/HZhhME5RwHSMfM44Apq8=
        SUEnableAutomaticChecks: false
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "Copyright © 2026 Kerem Can Seker. All rights reserved."
        CFBundleURLTypes:
          - CFBundleURLName: com.keremcan.seshat
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes:
              - seshat
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - net.daringfireball.markdown
              - public.markdown
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo:
              - public.plain-text
            UTTypeTagSpecification:
              public.filename-extension:
                - md
                - markdown
                - mdown
                - mkdn
              public.mime-type: text/markdown
    entitlements:
      path: Seshat/Seshat.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keremcan.seshat
        PRODUCT_NAME: Seshat
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: "\"Seshat/Preview Content\""
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
    dependencies:
      - package: MarkdownUI
        product: MarkdownUI
      - package: Sparkle
        product: Sparkle

  SeshatTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SeshatTests
    dependencies:
      - target: Seshat
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
